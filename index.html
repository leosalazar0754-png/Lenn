<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ánimo Corazón ✨</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #030108; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. ESCENA Y CÁMARA ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 4, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 80;
        controls.minDistance = 2;

        // --- 2. FONDO CÓSMICO MORADO/ROSA ---
        function createCosmicBackground() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#03010a';
            ctx.fillRect(0, 0, 512, 512);

            const addGlow = (x, y, r, color1, color2) => {
                const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
                grad.addColorStop(0, color1);
                grad.addColorStop(0.5, color2);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            };

            addGlow(256, 256, 225, 'rgba(138, 43, 226, 0.35)', 'rgba(75, 0, 130, 0.2)');
            addGlow(120, 150, 180, 'rgba(255, 20, 147, 0.25)', 'rgba(128, 0, 128, 0.1)');
            addGlow(380, 350, 200, 'rgba(186, 85, 211, 0.25)', 'rgba(0, 0, 50, 0.1)');

            const texture = new THREE.CanvasTexture(canvas);
            scene.background = texture;
        }

        createCosmicBackground();

        // --- 3. TEXTURA SUAVE PARA ESTRELLAS ---
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.5, 'rgba(224,176,255,0.5)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(16, 16, 16, 0, Math.PI * 2);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const starTexture = createStarTexture();

        // --- 4. CAMPO DE ESTRELLAS DE FONDO ---
        function create3DStarfield() {
            const starCount = 12000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount; i++) {
                const i3 = i * 3;
                const radius = 10 + Math.random() * 110;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);

                positions[i3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i3 + 2] = radius * Math.cos(phi);

                const isBright = Math.random() > 0.5;
                const starColor = new THREE.Color(
                    isBright ? '#ffffff' : (Math.random() > 0.5 ? '#da70d6' : '#ba55d3')
                );

                colors[i3] = starColor.r;
                colors[i3 + 1] = starColor.g;
                colors[i3 + 2] = starColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.25,
                sizeAttenuation: true,
                transparent: true,
                opacity: 0.9,
                vertexColors: true,
                map: starTexture,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            return new THREE.Points(geometry, material);
        }

        const starfield = create3DStarfield();
        scene.add(starfield);

        // --- 5. GRUPO GALAXIA UNIFICADO ---
        const galaxyGroup = new THREE.Group();
        scene.add(galaxyGroup);

        // --- 6. TEXTURA DE CORAZÓN ---
        function createHeartTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.beginPath();
            ctx.fillStyle = '#ffffff';
            ctx.moveTo(32, 48);
            ctx.bezierCurveTo(12, 30, 8, 16, 20, 10);
            ctx.bezierCurveTo(28, 6, 32, 16, 32, 16);
            ctx.bezierCurveTo(32, 16, 36, 6, 44, 10);
            ctx.bezierCurveTo(56, 16, 52, 30, 32, 48);
            ctx.fill();

            return new THREE.CanvasTexture(canvas);
        }

        const heartTexture = createHeartTexture();

        // --- 7. GALAXIA DE TONOS MORADOS Y ROSAS ---
        const galaxyParams = {
            count: 25000,
            size: 0.08,
            radius: 5.5,
            branches: 4,
            spin: 1,
            randomness: 0.5,
            power: 3.5,
            insideColor: '#da70d6',
            outsideColor: '#4b0082'
        };

        const generateGalaxy = () => {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(galaxyParams.count * 3);
            const colors = new Float32Array(galaxyParams.count * 3);

            const colorInside = new THREE.Color(galaxyParams.insideColor);
            const colorOutside = new THREE.Color(galaxyParams.outsideColor);

            for (let i = 0; i < galaxyParams.count; i++) {
                const i3 = i * 3;
                const radius = Math.random() * galaxyParams.radius;
                const spinAngle = radius * galaxyParams.spin;
                const branchAngle = ((i % galaxyParams.branches) / galaxyParams.branches) * Math.PI * 2;

                const randomX = Math.pow(Math.random(), galaxyParams.power) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * radius;
                const randomY = Math.pow(Math.random(), galaxyParams.power) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * radius;
                const randomZ = Math.pow(Math.random(), galaxyParams.power) * (Math.random() < 0.5 ? 1 : -1) * galaxyParams.randomness * radius;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / galaxyParams.radius);

                if (Math.random() > 0.85) {
                    mixedColor.add(new THREE.Color('#9370db'));
                }

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: galaxyParams.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                map: heartTexture,
                transparent: true
            });

            return new THREE.Points(geometry, material);
        };

        galaxyGroup.add(generateGalaxy());

        // --- 8. CREADOR DE TEXTOS DE ÁNIMO ---
        function createDelicateTextSprite(text, fontSize = 90, width = 1024, height = 256) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, width, height);

            ctx.font = `italic bold ${fontSize}px "Georgia", "Times New Roman", serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = '#ba55d3';
            ctx.shadowBlur = 30;
            ctx.fillStyle = '#ffffff';

            ctx.fillText(text, width / 2, height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            return new THREE.Sprite(spriteMaterial);
        }

        // TEXTO CENTRAL
        const nameSprite = createDelicateTextSprite('✨ Ánimo Corazón ✨', 100, 1024, 256);
        nameSprite.scale.set(7, 1.75, 1);
        nameSprite.position.set(0, 0.4, 0);
        galaxyGroup.add(nameSprite);

        // --- 9. FRASES DE APOYO Y ÁNIMO ---
        const spherePhrases = [
            "Ánimo corazón tú puedes",
            "Vamos arriba aquí te apoyo",
            "Eres más fuerte de lo que crees",
            "Todo va a estar bien ✨",
            "No estás sola jamás",
            "Tómate tu tiempo",
            "Un día a la vez",
            "Tu luz siempre brilla",
            "Estoy para ti siempre",
            "Eres una persona increíble",
            "Abrazos fuertes 💜",
            "Confía en ti",
            "Mañana será un mejor día",
            "Vales muchísimo",
            "Aquí estoy para escucharte"
        ];

        const sphereRadius = 7.5;

        spherePhrases.forEach((phrase, index) => {
            const phraseSprite = createDelicateTextSprite(phrase, 55, 1024, 256);
            phraseSprite.scale.set(4.8, 1.2, 1);

            const phi = Math.acos(1 - 2 * (index + 0.5) / spherePhrases.length);
            const theta = Math.PI * (1 + Math.sqrt(5)) * index;

            phraseSprite.position.x = sphereRadius * Math.sin(phi) * Math.cos(theta);
            phraseSprite.position.y = sphereRadius * Math.cos(phi);
            phraseSprite.position.z = sphereRadius * Math.sin(phi) * Math.sin(theta);

            galaxyGroup.add(phraseSprite);
        });

        // NUBE DE CORAZONES EN TONOS LILA Y MORADO
        function createFullSphereParticles() {
            const count = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const phi = Math.acos((Math.random() * 2) - 1);
                const theta = Math.random() * Math.PI * 2;
                const r = sphereRadius + (Math.random() - 0.5) * 3;

                positions[i3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i3 + 1] = r * Math.cos(phi);
                positions[i3 + 2] = r * Math.sin(phi) * Math.sin(theta);

                const c = new THREE.Color(
                    Math.random() > 0.3 ? (Math.random() > 0.5 ? '#da70d6' : '#ba55d3') : '#ffffff'
                );
                colors[i3] = c.r;
                colors[i3 + 1] = c.g;
                colors[i3 + 2] = c.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.16,
                sizeAttenuation: true,
                map: heartTexture,
                transparent: true,
                opacity: 0.95,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            return new THREE.Points(geometry, material);
        }

        galaxyGroup.add(createFullSphereParticles());

        // --- 10. METEORITOS ---
        const meteorCount = 15;
        const meteors = [];

        for (let i = 0; i < meteorCount; i++) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(6);
            positions[0] = 0; positions[1] = 0; positions[2] = 0;
            positions[3] = 0.6; positions[4] = 1.2; positions[5] = 0.6;

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.LineBasicMaterial({
                color: 0xe6e6fa,
                transparent: true,
                opacity: 0.95
            });

            const line = new THREE.Line(geometry, material);
            const meteor = {
                mesh: line,
                speed: 0.12 + Math.random() * 0.06,
                reset: function() {
                    this.mesh.position.set(
                        (Math.random() - 0.5) * 30,
                        12 + Math.random() * 8,
                        (Math.random() - 0.5) * 30
                    );
                }
            };
            meteor.reset();
            meteors.push(meteor);
            scene.add(meteor.mesh);
        }

        // --- 11. ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            const rotationValue = Date.now() * 0.00015;
            galaxyGroup.rotation.y = rotationValue;

            starfield.rotation.y = -rotationValue * 0.1;

            meteors.forEach(meteor => {
                meteor.mesh.position.x -= meteor.speed * 0.5;
                meteor.mesh.position.y -= meteor.speed;
                meteor.mesh.position.z -= meteor.speed * 0.5;

                if (meteor.mesh.position.y < -12) {
                    meteor.reset();
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- 12. REDIMENSIONAR ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
    </script>
</body>
</html>
